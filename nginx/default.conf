server {

    # Este archivo es el importante cuando queremos que la carpeta front se comunique con el back

    listen 80;
    server_name localhost;

    # REGLA 1: Todo lo que sea / va al FRONTEND
    location / {
        # Redirige al contenedor "frontend" puerto 5173 (puerto interno de Vite)
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
  
    }

   location ~ ^/(login|register|dashboard|logout|password|verify-email) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # REGLA 2: Todo lo que empiece por /api va al BACKEND
    location /api {
        # Redirige al contenedor "backend" puerto 8000 (puerto interno de Laravel)
        # Nota: Necesitarás arrancar Laravel con "php artisan serve" en el Dockerfile
        # o configurar PHP-FPM aquí. Para empezar, usaremos proxy directo.
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /build {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    location /storage {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}