server {
    listen 80;
    server_name localhost;
    
    # Ocultar versión de Nginx (Seguridad básica)
    server_tokens off;

    # =================================================================
    # 1. BLOQUEO DE SEGURIDAD (Lo primero es cerrar puertas)
    # =================================================================
    # Evita que descarguen tu .env, .git, etc.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # =================================================================
    # 2. BACKEND (Laravel) - Prioridad Alta
    # =================================================================
    
    # Grupo A: API, Storage y Build
    location ~ ^/(api|storage|build) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Grupo B: Rutas de Autenticación de Breeze/Laravel
    # Agrupamos todas las palabras clave del login en una sola regla
    location ~ ^/(login|register|logout|password|verify-email|sanctum|profile|dashboard|edit) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }


    # =================================================================º
    # =================================================================

    # Grupo C: Recursos estáticos (CSS, JS, Assets, Imágenes frontend)
    location ~ ^/(css|js|assets)/ {
        proxy_pass http://frontend:5173/src/$uri; 
        # Nota: Ajusta /src/ si Vite los sirve desde raíz, pero según tu config anterior estaban en src.
        # Si Vite lo sirve directo, usa simplemente: proxy_pass http://frontend:5173;
        proxy_set_header Host $host;
    }

    # Páginas HTML específicas 
    location ~ ^/(desktop|setup|misTarjetas|ajustes|api-estadisticas)$ {
        proxy_pass http://frontend:5173/src/html/$1.html;
        proxy_set_header Host $host;
    }

    # =================================================================
    # 4. REGLA POR DEFECTO (Landing Page / Root)
    # =================================================================
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}