server {
    # =================================================================
    # CONFIGURACIÓN BÁSICA DEL SERVIDOR
    # =================================================================
    listen 80;
    server_name localhost;
    
    # Tipos de archivos estándar (para que sepa qué es un CSS, JS, etc.)
    include /etc/nginx/mime.types;

    # =================================================================
    # ZONA 1: EXCEPCIONES Y RUTAS MANUALES DEL FRONTEND
    # (Reglas específicas que deben revisarse antes que la general)
    # =================================================================
    
    location /dashboard {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    location /desktop {
                # El usuario ve "/dashboard", pero Nginx trae "desktop.html"
        proxy_pass http://frontend:5173/src/html/desktop.html;
        proxy_set_header Host $host;
    }
    location /setup {
        # Apunta al archivo HTML de tu guia paso a paso
        proxy_pass http://frontend:5173/src/html/setup.html; 
        proxy_set_header Host $host;
    }
    

    location /misTarjetas {
        proxy_pass http://frontend:5173/src/html/misTarjetas.html;
        proxy_set_header Host $host;
    }

    location /ajustes {
        proxy_pass http://frontend:5173/src/html/ajustes.html;
        proxy_set_header Host $host;
    }

    location /api-estadisticas {
        proxy_pass http://frontend:5173/src/html/api-estadisticas.html;
        proxy_set_header Host $host;
    }

  



    # -> Correcciones de rutas de recursos (CSS/JS)
    # Si tu HTML pide "/css/estilo.css" pero en Vite está en "/src/css/", esto lo arregla.
    location /css/ {
        proxy_pass http://frontend:5173/src/css/; 
        proxy_set_header Host $host;
    }
    
    location /js/ {
        proxy_pass http://frontend:5173/src/js/;
        proxy_set_header Host $host;
    }



    # =================================================================
    # ZONA 2: EL BACKEND (Cerebro - Laravel)
    # =================================================================

    # -> API REST: Todo lo que empiece por /api se va a Laravel
    location /api {
        proxy_pass http://backend:8000;
        
        # Cabeceras para que Laravel sepa quién es el cliente real
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # -> RUTAS DE AUTENTICACIÓN (Login, Register, etc.)
    # Usamos una expresión regular (~) para capturar varias palabras clave a la vez
    location ~ ^/(login|register|logout|password|verify-email|sanctum|profile) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /edit {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # -> RECURSOS PÚBLICOS DE LARAVEL (Imágenes subidas, builds, etc.)
    location /storage {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /build {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # =================================================================
    # ZONA 3: EL FRONTEND (La Cara - Vite) - REGLA POR DEFECTO
    # =================================================================
    
    # Si la petición no coincide con ninguna de las anteriores, cae aquí.
    location / {
        proxy_pass http://frontend:5173;
        
        # --- CONFIGURACIÓN PARA VITE (HMR - Hot Module Replacement) ---
        # Estas líneas son vitales para que la recarga automática funcione en desarrollo
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}