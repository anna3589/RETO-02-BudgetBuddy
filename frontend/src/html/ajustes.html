<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>BudgetBuddy | Mi cuenta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/notification.css" />
    <link rel="stylesheet" href="../css/ajustes.css" />
</head>
<body class="desktop-body">
    <header class="desktop-header">
        <div class="desktop-brand">
            <img src="../images/logo_budget_expand.png" alt="BudgetBuddy Logo">
        </div>
        <div class="desktop-header-right">
            <div class="top-icon notification-btn" title="Notificaciones">
                <i class="fas fa-bell"></i>
                <span class="notification-badge">3</span>
            </div>
            <div class="user-profile-top">
                <div class="user-avatar-top" title="Mi perfil" id="user-avatar-top">...</div>
            </div>
        </div>
    </header>
    
    <div class="sidebar">   
        <div class="nav-menu">
            <a href="/desktop" class="nav-item" title="Inicio"><i class="fas fa-home"></i></a>
            <a href="/api-estadisticas" class="nav-item" title="Estadísticas"><i class="fas fa-chart-line"></i></a>
            <a href="/misTarjetas" class="nav-item" title="Tarjetas"><i class="fas fa-credit-card"></i></a>
            <a href="/ajustes" class="nav-item active" title="Ajustes"><i class="fas fa-cog"></i></a>
        </div>
    </div>
    
    <div class="desktop-container">
        <main class="desktop-main">
            <div class="page-header">
                <h1 class="page-title">Mi cuenta</h1>
                <button class="btn btn-secondary" id="edit-profile-btn">
                    <i class="fas fa-edit"></i> Editar perfil
                </button>
            </div>
            
            <div class="desktop-grid">
                <section class="desktop-left-column">
                    <div class="card">
                        <div class="card-header-compact"><h2 class="card-title">Perfil</h2></div>
                        
                        <div class="profile-view-mode" id="profile-view-mode">
                            <div class="profile-avatar-section">
                                <div class="profile-avatar-large" id="profile-avatar-large">...</div>
                                <div class="profile-name-view">
                                    <h3 id="profile-full-name-view">Cargando...</h3>
                                </div>
                            </div>
                            <div class="profile-info-view">
                                <div class="info-row">
                                    <div class="info-label">Correo</div>
                                    <div class="info-value" id="view-email">...</div>
                                </div>
                                <div class="info-row">
                                    <div class="info-label">Teléfono</div>
                                    <div class="info-value" id="view-phone">...</div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="profile-edit-mode" id="profile-edit-mode" style="display: none;">
                            <div class="profile-avatar-section">
                                <div class="profile-avatar-large" id="profile-avatar-large-edit">JD</div>
                                <div class="avatar-actions">
                                    <button class="btn btn-secondary" id="change-avatar-btn"><i class="fas fa-camera"></i> Cambiar avatar</button>
                                    <button class="btn btn-secondary btn-danger" id="remove-avatar-btn"><i class="fas fa-trash"></i> Eliminar avatar</button>
                                </div>
                            </div>
                            
                            <form class="profile-form" id="profile-form">
                                <div class="form-row">
                                    <div class="form-group">
                                        <label for="first-name">Nombre</label>
                                        <input type="text" id="first-name" class="editable-input" required>
                                    </div>
                                    <div class="form-group">
                                        <label for="last-name">Apellido</label>
                                        <input type="text" id="last-name" class="editable-input">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label for="email">Correo electrónico</label>
                                    <input type="email" id="email" class="editable-input" required>
                                </div>
                                <div class="form-group">
                                    <label for="phone">Teléfono</label>
                                    <input type="tel" id="phone" class="editable-input">
                                </div>
                                <div class="form-actions">
                                    <button type="button" class="btn btn-secondary" id="cancel-edit-btn">Cancelar</button>
                                    <button type="submit" class="btn btn-primary" id="save-changes-btn">Guardar cambios</button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header-compact"><h2 class="card-title">Seguridad</h2></div>
                        <div class="security-settings">
                            <div class="security-item">
                                <div class="security-info"><h4>Cambiar contraseña</h4></div>
                                <button class="btn btn-secondary" id="change-password-btn">Cambiar</button>
                            </div>
                            <div class="security-item">
                                <div class="security-info"><h4>Sesiones activas</h4></div>
                                <button class="btn btn-secondary" id="view-sessions-btn">Ver</button>
                            </div>
                        </div>
                    </div>
                </section>
                
                <section class="desktop-right-column">
                    <div class="card">
                        <div class="card-header-compact"><h2 class="card-title">Más opciones</h2></div>
                        <div class="other-settings">
                            <div class="settings-item">
                                <div class="settings-info"><h4>Exportar datos</h4></div>
                                <button class="btn btn-secondary" id="export-data-btn">Exportar</button>
                            </div>
                            <div class="settings-item logout-item">
                                <div class="settings-info"><h4>Salir de la cuenta</h4></div>
                                <button class="btn btn-secondary" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Salir</button>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <div class="modal" id="password-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Cambiar contraseña</h3>
                <button class="close-modal" id="close-password-modal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="password-form">
                    <div class="form-group"><label for="current-password">Actual</label><input type="password" id="current-password" required></div>
                    <div class="form-group"><label for="new-password">Nueva</label><input type="password" id="new-password" required></div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" id="cancel-password-btn">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../js/ajustes.js"></script>
    <script src="../js/notifications.js"></script>
</body>
</html>
