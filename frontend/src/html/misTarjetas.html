<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device
    -width, initial-scale=1.0"
		/>
		<title>BudgetBuddy | Mis Tarjetas</title>
		<meta name="csrf-token" content="CSRF_TOKEN_PLACEHOLDER" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap"
			rel="stylesheet"
		/>
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
		/>
		<link rel="stylesheet" href="../css/style.css" />
		<link rel="stylesheet" href="../css/tarjetas.css" />
		<link rel="stylesheet" href="../css/notification.css" />
	</head>
	<body class="desktop-body">
		<header class="desktop-header">
			<div class="desktop-brand">
				<img src="../images/logo_budget_expand.png" alt="" />
			</div>

			<div class="desktop-header-right">
				<div class="user-profile-top">
					<div class="user-avatar-top" title="Mi perfil">...</div>
				</div>
			</div>
		</header>

		<!-- Мобільна навігаційна панель -->
		<nav class="mobile-nav">
			<ul class="mobile-nav-items">
				<li>
					<a
						href="/desktop"
						class="mobile-nav-item"
						data-page="dashboard"
						title="Panel general"
					>
						<i class="fas fa-home"></i>
						<span>Inicio</span>
					</a>
				</li>
				<li>
					<a
						href="/estadisticas"
						class="mobile-nav-item"
						data-page="estadisticas"
						title="Estadísticas"
					>
						<i class="fas fa-chart-line"></i>
						<span>Estadísticas</span>
					</a>
				</li>
				<li>
					<a
						href="/misTarjetas"
						class="mobile-nav-item active"
						data-page="cards"
						title="Mis tarjetas"
					>
						<i class="fas fa-credit-card"></i>
						<span>Tarjetas</span>
					</a>
				</li>
				<li>
					<a
						href="/ajustes"
						class="mobile-nav-item"
						data-page="profile"
						title="Mi cuenta"
					>
						<i class="fas fa-cog"></i>
						<span>Ajustes</span>
					</a>
				</li>
			</ul>
		</nav>

		<!-- Sidebar Navigation -->
		<div class="sidebar">
			<div class="nav-menu">
				<a
					href="/desktop"
					class="nav-item"
					data-page="dashboard"
					title="Panel general"
					aria-label="Panel general"
				>
					<i class="fas fa-home" aria-hidden="true"></i>
				</a>
				<a
					href="/estadisticas"
					class="nav-item"
					data-page="estadisticas"
					title="Estadísticas"
					aria-label="Estadísticas"
				>
					<i class="fas fa-chart-line" aria-hidden="true"></i>
				</a>
				<a
					href="/misTarjetas"
					class="nav-item active"
					data-page="cards"
					title="Mis tarjetas"
					aria-label="Mis tarjetas"
				>
					<i class="fas fa-credit-card" aria-hidden="true"></i>
				</a>
				<a
					href="/ajustes"
					class="nav-item"
					data-page="profile"
					title="Mi cuenta"
					aria-label="Ajustes de cuenta"
				>
					<i class="fas fa-cog" aria-hidden="true"></i>
				</a>
			</div>
		</div>

		<div class="desktop-container">
			<main class="desktop-main">
				<div class="page-header">
					<h1 class="page-title">
						Mis tarjetas
						<div class="date-container" id="current-date">--/--/----</div>
					</h1>
				</div>

				<div class="desktop-grid">
					<section class="desktop-left-column">
						<!-- СЕКЦІЯ ВИБОРУ КАРТКИ ТА КАРТОК -->
						<div class="card">
							<div class="card-header-compact">
								<h2 class="card-title">Tarjeta Principal</h2>
								<div class="account-selector">
									<select id="cardAccountSelect" class="account-dropdown">
										<option value="">Cargando tarjetas...</option>
									</select>
									<div class="dropdown-arrow">
										<i class="fas fa-chevron-down"></i>
									</div>
								</div>
							</div>

							<!-- Контейнер для карток з фіксованою висотою ТА ГОРИЗОНТАЛЬНИМ СКРОЛОМ -->
							<div class="cards-section-wrapper">
								<div id="cards-container" class="dashboard-cards-grid">
									<!-- Картки будуть додаватися через JavaScript -->
									<div
										style="
											width: 100%;
											text-align: center;
											padding: 30px;
											color: #9ca3af;
										"
									>
										<i class="fas fa-spinner fa-spin"></i> Cargando tarjetas...
									</div>
								</div>
								<!-- Зона для видалення додається через JS -->
							</div>
						</div>

						<!-- ТРАНЗАКЦІЇ -->
						<div class="card">
							<div class="card-header-compact">
								<div class="transactions-header">
									<h2 class="card-title">Transacciones</h2>
									<div class="transactions-actions">
										<div class="transactions-filters">
											<button class="filter-btn active" data-filter="all">
												Todos
											</button>
											<button class="filter-btn" data-filter="income">
												Ingresos
											</button>
											<button class="filter-btn" data-filter="expense">
												Pagos
											</button>
										</div>
										<button class="btn-primary" id="createMovementBtn">
											<i class="fas fa-plus"></i> Nuevo movimiento
										</button>
									</div>
								</div>
							</div>
							<div class="transactions-table">
								<table>
									<thead>
										<tr>
											<th>Descripción</th>
											<th>ID</th>
											<th>Fecha</th>
											<th>Monto</th>
											<th>Categorías</th>
										</tr>
									</thead>
									<tbody id="transactions-body">
										<tr class="loading-row">
											<td colspan="5" style="text-align: center; padding: 30px">
												<i class="fas fa-spinner fa-spin"></i> Cargando
												transacciones...
											</td>
										</tr>
									</tbody>
								</table>
							</div>
						</div>
					</section>
				</div>
			</main>
		</div>

		<!-- МОДАЛ ДЛЯ ДОДАВАННЯ КАРТКИ -->
		<dialog id="cardModal" class="tag-modal">
			<div class="modal-content">
				<div class="modal-header">
					<h3><i class="fas fa-credit-card"></i> Nueva Tarjeta</h3>
					<button class="close-modal" id="closeCardModal">&times;</button>
				</div>

				<form id="createCardForm" class="modal-body">
					<div class="form-group">
						<label for="card-account-select">Cuenta Vinculada</label>
						<div style="position: relative">
							<select
								id="card-account-select"
								class="account-dropdown"
								style="padding: 8px 10px; font-size: 14px"
							>
								<option value="">Cargando cuentas...</option>
							</select>
							<i
								class="fas fa-chevron-down"
								style="
									position: absolute;
									right: 10px;
									top: 50%;
									transform: translateY(-50%);
									pointer-events: none;
									font-size: 12px;
									color: #757575;
								"
							></i>
						</div>
					</div>

					<div class="form-group">
						<label for="card-alias">Alias de la tarjeta</label>
						<input
							type="text"
							id="card-alias"
							placeholder="Ej: Para Viajes"
							required
							maxlength="20"
						/>
					</div>

					<div class="form-group">
						<label>Tipo de Tarjeta</label>
						<div class="card-type-selector">
							<label class="type-option">
								<input type="radio" name="card_type" value="debit" checked />
								<div class="type-content visa-style">
									<i class="fab fa-cc-visa"></i>
									<span>Visa (Débito)</span>
								</div>
							</label>
							<label class="type-option">
								<input type="radio" name="card_type" value="credit" />
								<div class="type-content master-style">
									<i class="fab fa-cc-mastercard"></i>
									<span>Mastercard (Crédito)</span>
								</div>
							</label>
						</div>
					</div>

					<div style="display: flex; gap: 15px">
						<div class="form-group" style="flex: 1">
							<label for="card-digits">Últimos 4 dígitos</label>
							<input
								type="text"
								id="card-digits"
								placeholder="1234"
								maxlength="4"
								pattern="\d{4}"
								required
								style="letter-spacing: 2px; text-align: center"
							/>
						</div>

						<div class="form-group" style="flex: 1">
							<label for="card-exp">Caducidad</label>
							<input type="month" id="card-exp" required />
						</div>
					</div>
				</form>

				<div class="modal-footer">
					<button class="btn-secondary" id="cancelCardBtn">Cancelar</button>
					<button class="btn-primary" id="saveCardBtn">Guardar Tarjeta</button>
				</div>
			</div>
		</dialog>

		<!-- МОДАЛ ДЛЯ СТВОРЕННЯ MOVEMENT -->
		<dialog id="movementModal" class="tag-modal">
			<div class="modal-content">
				<div class="modal-header">
					<h3><i class="fas fa-exchange-alt"></i> Nuevo Movimiento</h3>
					<button class="close-modal" id="closeMovementModal">&times;</button>
				</div>

				<form id="movementForm" class="modal-body">
					<div class="form-group">
						<label for="movementType">Tipo de movimiento</label>
						<div class="type-selector">
							<label class="type-option">
								<input
									type="radio"
									name="movement_type"
									value="gasto"
									checked
								/>
								<div class="type-content">
									<i class="fas fa-arrow-up" style="color: #ef4444"></i>
									<span>Gasto</span>
								</div>
							</label>
							<label class="type-option">
								<input type="radio" name="movement_type" value="ingreso" />
								<div class="type-content">
									<i class="fas fa-arrow-down" style="color: #10b981"></i>
									<span>Ingreso</span>
								</div>
							</label>
							<label class="type-option">
								<input type="radio" name="movement_type" value="traspaso" />
								<div class="type-content">
									<i class="fas fa-exchange-alt" style="color: #3b82f6"></i>
									<span>Traspaso</span>
								</div>
							</label>
						</div>
					</div>

					<div class="form-group">
						<label for="movementAmount">Monto (€)</label>
						<input
							type="number"
							id="movementAmount"
							step="0.01"
							placeholder="0.00"
							required
						/>
					</div>

					<div class="form-group">
						<label for="movementDescription">Descripción</label>
						<input
							type="text"
							id="movementDescription"
							placeholder="Ej: Compra en supermercado"
							required
						/>
					</div>

					<div class="form-group">
						<label for="movementDate">Fecha</label>
						<input type="date" id="movementDate" required />
					</div>

					<div class="form-group">
						<label for="movementCard">Tarjeta</label>
						<select id="movementCard" class="account-dropdown">
							<option value="">Cargando tarjetas...</option>
						</select>
					</div>

					<div class="form-group">
						<label for="movementCategory">Categoría (Etiqueta)</label>
						<select id="movementCategory" class="account-dropdown">
							<option value="">Seleccionar etiqueta...</option>
						</select>
					</div>

					<div class="form-group">
						<label for="movementEnvelope">Sobre (Opcional)</label>
						<select id="movementEnvelope" class="account-dropdown">
							<option value="">Sin sobre</option>
						</select>
					</div>
				</form>

				<div class="modal-footer">
					<button class="btn-secondary" id="cancelMovementBtn">Cancelar</button>
					<button class="btn-primary" id="saveMovementBtn">
						Guardar Movimiento
					</button>
				</div>
			</div>
		</dialog>

		<script src="../js/tarjetas.js"></script>
		<script src="../js/notifications.js"></script>
	</body>
</html>
