<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BudgetBuddy | Mis Tarjetas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/tarjetas.css">
    <link rel="stylesheet" href="../css/invoices-modal.css">
    <link rel="stylesheet" href="../css/notification.css">
</head>
<body class="desktop-body">
    <header class="desktop-header">
        <div class="desktop-brand">
            <img src="../images/logo_budget_expand.png" alt="BudgetBuddy">
        </div>
        <div class="desktop-header-right">
            <div class="top-icon" title="Buscar"><i class="fas fa-search"></i></div>
            <div class="top-icon notification-btn" title="Notificaciones">
                <i class="fas fa-bell"></i>
                <span class="notification-badge">3</span>
            </div>
            <div class="user-profile-top">
                <div class="user-avatar-top" title="Mi perfil">JD</div>
            </div>
        </div>
    </header>

    <div class="sidebar">   
        <div class="nav-menu">
            <a href="/desktop" class="nav-item" title="Inicio"><i class="fas fa-home"></i></a>
            <a href="/api-estadisticas" class="nav-item" title="Estadísticas"><i class="fas fa-chart-line"></i></a>
            <a href="/misTarjetas" class="nav-item active" title="Tarjetas"><i class="fas fa-credit-card"></i></a>
            <a href="/ajustes" class="nav-item" title="Ajustes"><i class="fas fa-cog"></i></a>
        </div>
    </div>
    
    <div class="desktop-container">
        <main class="desktop-main">
            <div class="page-header">
                <h1 class="page-title">
                    Mis tarjetas
                    <div class="date-container" id="current-date">--/--/----</div>
                </h1>
            </div>
            
            <div class="desktop-grid">
                <section class="desktop-left-column">
                    <div class="card card-small">
                        <div class="card-header-compact">
                            <h2 class="card-title" id="cards-title">Cargando...</h2>
                            <div class="card-nav">
                                <button class="card-nav-btn prev-card-btn"><i class="fas fa-chevron-left"></i></button>
                                <span class="card-counter" id="card-counter">0/0</span>
                                <button class="card-nav-btn next-card-btn"><i class="fas fa-chevron-right"></i></button>
                            </div>
                        </div>
                        <div class="cards-carousel" id="cards-container">
                            <div class="loading-state">Cargando tarjetas...</div>
                        </div>
                        <div class="card-usage">
                            <div class="usage-item">
                                <div class="usage-label">Gastos semanales</div>
                                <div class="usage-amount" id="weekly-expenses">0,00€</div>
                            </div>
                            <div class="usage-item">
                                <div class="usage-label">Disponible</div>
                                <div class="usage-amount available" id="available-balance">0,00€</div>
                            </div>
                        </div>
                    </div> 
                    
                    <div class="card">
                        <div class="card-header-compact">
                            <div class="transactions-header">
                                <h2 class="card-title">Transacciones</h2>
                                <div class="transactions-filters">
                                    <button class="filter-btn active" data-filter="all">Todos</button>
                                    <button class="filter-btn" data-filter="income">Ingresos</button>
                                    <button class="filter-btn" data-filter="payment">Pagos</button>
                                </div>
                            </div>
                        </div>
                        <div class="transactions-table">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Nombre</th>
                                        <th>ID transacción</th>
                                        <th>Terminal</th>
                                        <th>Fecha</th>
                                        <th>Monto</th>
                                    </tr>
                                </thead>
                                <tbody id="transactions-body"></tbody>
                            </table>
                        </div>
                    </div>
                </section>
                
                <section class="desktop-right-column">
                    <div class="card">
                        <div class="card-header-compact">
                            <h2 class="card-title">Facturas</h2>
                            <button class="view-all-btn" id="viewAllInvoices">
                                Ver todas <i class="fas fa-arrow-right"></i>
                            </button>
                        </div>
                        <div class="invoices-list" id="invoices-summary-container">
                            </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="invoicesModal">
        <div class="invoices-modal">
            <div class="modal-header">
                <h2 class="modal-title">Todas las facturas</h2>
                <button class="close-modal" id="closeModal"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-content">
                <div class="modal-stats" id="modal-stats-container">
                    <div class="modal-stat-item">
                        <div class="modal-stat-value" id="modal-total-count">0</div>
                        <div class="modal-stat-label">Total facturas</div>
                    </div>
                    <div class="modal-stat-item">
                        <div class="modal-stat-value" id="modal-total-amount">0,00€</div>
                        <div class="modal-stat-label">Total gastado</div>
                    </div>
                </div>
                
                <div class="modal-invoices-list" id="modal-invoices-list">
                    </div>
            </div>
        </div>
    </div>

    <script src="../js/tarjetas.js"></script>
    <script src="../js/notifications.js"></script>
</body>
</html>
