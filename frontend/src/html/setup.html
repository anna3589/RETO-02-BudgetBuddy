<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configuración Inicial | BudgetBuddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/setup.css" />
    <style>
        /* ... TUS ESTILOS EXISTENTES (step-content, wizard-buttons, etc) ... */
        .step-content { display: none; animation: fadeIn 0.4s ease-out; }
        .step-content.active { display: block; }
        .wizard-buttons { display: flex; justify-content: space-between; margin-top: 25px; gap: 10px; }
        .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
        /* ... resto de tu CSS ... */
    </style>
</head>
<body>
    <div class="wizard-container">
        <div class="wizard-header">
            <img src="../assets/img/logo_budget.png" alt="Logo" />
            <h2>Configuración</h2>
            <p>Paso <span id="step-number">1</span> de 4</p>
        </div>

        <div class="wizard-body">
            <div class="step-indicator">
                <div class="step-dot active" id="dot-1"></div>
                <div class="step-dot" id="dot-2"></div>
                <div class="step-dot" id="dot-3"></div>
                <div class="step-dot" id="dot-4"></div>
            </div>

            <form id="setup-form">
                
                <div id="step-1" class="step-content active">
                    <h3 style="margin-bottom: 15px; color: var(--text-main)">
                        1. Completa tu Perfil
                    </h3>
                    <p style="font-size: 0.9rem; color: #6b7280; margin-bottom: 20px;">
                        Antes de empezar, necesitamos confirmar tus datos personales.
                    </p>

                    <div class="form-group">
                        <label>Nombre</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user"></i>
                            <input type="text" id="setup_firstname" placeholder="Tu nombre" required />
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Apellidos</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user-tag"></i>
                            <input type="text" id="setup_lastname" placeholder="Tus apellidos" required />
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Teléfono (Opcional)</label>
                        <div class="input-wrapper">
                            <i class="fas fa-phone"></i>
                            <input type="tel" id="setup_phone" placeholder="+34 600 000 000" />
                        </div>
                    </div>

                    <div class="wizard-buttons">
                        <div></div> <button type="button" class="btn-primary" id="btn-step-1">
                            Siguiente <i class="fas fa-arrow-right"></i>
                        </button>
                    </div>
                </div>

                <div id="step-2" class="step-content">
                    <h3 style="margin-bottom: 15px; color: var(--text-main)">
                        2. Tu Cuenta Principal
                    </h3>
                    <div class="form-group">
                        <label>Nombre del Banco</label>
                        <div class="input-wrapper">
                            <i class="fas fa-university"></i>
                            <input type="text" id="bank_name" placeholder="Ej: BBVA Principal" /> 
                            </div>
                    </div>
                    <div class="form-group">
                         <label>Saldo Actual (€)</label>
                         <div class="input-wrapper">
                             <i class="fas fa-euro-sign"></i>
                             <input type="number" id="current_balance" step="0.01" placeholder="0.00" />
                         </div>
                    </div>
                    
                    <div class="form-group">
                        <label>IBAN</label>
                        <div class="input-wrapper iban-composite" style="display: flex; align-items: stretch">
                             <select id="iban_country" class="country-select">
                                <option value="ES" selected>🇪🇸 ES</option>
                                </select>
                             <input type="text" id="iban_number" placeholder="0000..." style="border-left:none" />
                        </div>
                    </div>
                    
                    <input type="hidden" id="account_color" value="#217A4A" />

                    <div class="wizard-buttons">
                        <button type="button" class="btn-primary btn-outline" onclick="goToStep(1)">Atrás</button>
                        <button type="button" class="btn-primary" onclick="goToStep(3)">Siguiente <i class="fas fa-arrow-right"></i></button>
                    </div>
                </div>

                <div id="step-3" class="step-content">
                    <h3 style="margin-block-end: 15px; color: var(--text-main)">
                        3. Tarjeta Asociada
                    </h3>
                    
                    <div class="skip-toggle" onclick="toggleSection('card')">
                        <span>¿Añadir Tarjeta?</span>
                        <div class="toggle-switch"><input type="checkbox" id="has_card" style="pointer-events:none"></div>
                    </div>
                    <div id="card-fields" style="display: none">
                        <div class="form-group"><label>Alias</label><input type="text" id="card_alias"></div>
                        </div>

                    <div class="wizard-buttons">
                        <button type="button" class="btn-primary btn-outline" onclick="goToStep(2)">Atrás</button>
                        <button type="button" class="btn-primary" onclick="goToStep(4)">Siguiente <i class="fas fa-arrow-right"></i></button>
                    </div>
                </div>

                <div id="step-4" class="step-content">
                    <h3 style="margin-block-end: 15px; color: var(--text-main)">
                        4. Sobre Digital (Presupuesto)
                    </h3>

                    <div class="skip-toggle" onclick="toggleSection('envelope')">
                        <span>¿Crear primer Sobre?</span>
                        <div class="toggle-switch"><input type="checkbox" id="has_envelope" style="pointer-events:none"></div>
                    </div>
                    <div id="envelope-fields" style="display: none">
                        <div class="form-group"><label>Nombre</label><input type="text" id="env_name"></div>
                        </div>

                    <div class="wizard-buttons">
                        <button type="button" class="btn-primary btn-outline" onclick="goToStep(3)">Atrás</button>
                        <button type="submit" id="btn-submit" class="btn-primary" style="background: #10b981">
                            <i class="fas fa-check"></i> Finalizar
                        </button>
                    </div>
                </div>

            </form>
        </div>
    </div>
    <script src="../js/setup.js"></script>
</body>
</html>
